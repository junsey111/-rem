listen 1935;
max_connections 1000;
daemon off;
srs_log_tank console;
http_api {
    enabled on;
    listen 1985;
}
vhost __defaultVhost__ {
    hls {
        enabled on;
        hls_path /srv/hls;
        hls_fragment 2;
        hls_window 6;
        hls_m3u8_file [app]/[stream].m3u8;
        hls_ts_file [app]/[stream]-[seq].ts;
    }
    http_hooks {
        enabled on;
        on_publish http://billd-live-server:4300/srs/hook?key=MEDIA_HOOK_KEY;
        on_unpublish http://billd-live-server:4300/srs/hook?key=MEDIA_HOOK_KEY;
    }
    # No unauthenticated RTMP subscribers, HTTP-FLV, WebRTC or SRT endpoints.
    security {
        enabled on;
        deny play all;
        allow publish all;
    }
}
